<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>produtos</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <main>
        <h1>ERP ARMAZEN 1.0vs</h1>
        <h2>Produtos em estoque</h2>
    <div class="container">
        <section>
            <button type="submit">Cadastrar</button>
            <button type="submit">Buscar</button>
            <button type="submit">Excluir</button>
            <button type="submit">Atualizar</button>
        </section>
         <section>    
            <div class = "tabela">
                <table>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                    </tr>
                    <tr>
                        <td>Notebook</td>
                        <td>4000</td>
                        <td>3</td>
                    </tr>
                    <tr>
                        <td>Mouse</td>
                        <td>120</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>Teclado</td>
                        <td>250</td>
                        <td>10</td>
                    </tr>
                </table>
            </div>
        </section>
    </div>    
        <section>
            <h3>Parâmetros</h3>
            <div class="formulario">
                <form>
                    <label for="nome">Nome:</label>
                    <input
                        type="text"
                        id="nome" 
                        name="nome"
                        placeholder="Insira o nome do produto">
                     <br>
                    <label for="preco">Preço:</label>
                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        placeholder="Insira o preço do produto">
                    <br>
                    <label for="quantidade">Quantidade:</label>
                    <input
                    type="number"
                    id="quantidade"
                    name="quantidade"
                    placeholder="Insira a quantidade do produto">
                    <br>
                </form>
                <br>
            </div>
        </section>    
    </main>
    <br>
    <footer>
        Software desenvolvido por Matheus Henrique
    </footer>
</body>
</html>
