<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>produtos</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <main>
        <h1>ERP ARMAZEN 1.0vs</h1>
        <h2>Produtos em estoque</h2>
    <div class="container">
        <section>
            <button type="button" id="btn-cadastrar">Cadastrar</button>
            <button type="button" id="btn-buscar">Buscar</button>
            <button type="button" id="btn-atualizar">Atualizar</button>
            <button id="btn-logout">Sair</button>
        </section>    

        <div id="formulario-cadastro" hidden>
            <h3>Cadastrar produto</h3>
        
            <form id="form-cadastro">
                <label for="nome-produto">Nome:</label>
                <input
                    type="text"
                    id="nome-produto"
                    required
                >
            
                <label for="preco-produto">Preço:</label>
                <input
                    type="number"
                    id="preco-produto"
                    min="0"
                    step="0.01"
                    required
                >
            
                <label for="quantidade-produto">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade-produto"
                    min="0"
                    step="1"
                    required
                >
            
                <button type="submit">Salvar produto</button>
                <button type="button" id="btn-cancelar">Cancelar</button>
            </form>
        
            <p id="mensagem-cadastro"></p>
        </div>

            <div class = "tabela">
                <table>
                    <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                
                    <tbody id="lista-produtos">
                    </tbody>
                </table>
            </div>
        </section>
    </div>    
    </main>
    <br>
    <footer>
        Software desenvolvido por Matheus Henrique
    </footer>
    <script src="{{ url_for('static', filename='js/produtos.js') }}"></script>
</body>
</html>
